name: Release

# Publishes the version in pyproject.toml to PyPI as rask-sdk, then tags it and makes the GitHub Release.
# Started by hand and only from the default branch: `gh workflow run release.yml`, or "Run workflow" on the Actions tab.
# So the workflow that publishes is always the reviewed one, and nothing is public before the checks pass.
# PyPI trusts this workflow itself (trusted publishing, OIDC), so there is no PyPI token in this repository: on pypi.org
# the project names this repository, this file and the environment `pypi` as its publisher. RELEASING.md has the steps.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: checks
    runs-on: ubuntu-latest
    # The environment takes only the default branch.
    environment: pypi
    permissions:
      contents: write # the tag and the GitHub Release
      id-token: write # what PyPI exchanges for a publish right
    steps:
      - name: Only from the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::A release is cut from $DEFAULT_BRANCH, and this run is on $GITHUB_REF_NAME."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # No dependency cache in the job that may publish: a cache is something another run could have written.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: false
      - name: The version is not released yet
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          # The tag is made last, so it is the tag that says a release is complete. A version without one whose files
          # PyPI already has is a release that stopped half way, and this run finishes it.
          tagged=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || tagged=$?
          if [ "$tagged" != 2 ]; then
            echo "::error::$version is already released, or that could not be checked (tag lookup $tagged, where 2 means no tag). Set the next version in pyproject.toml and rask_sdk/_version.py first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: uv build
      # With the check URL a file PyPI already has is skipped when it is the same bytes, so a second run uploads only
      # what the first did not. A file PyPI has with other bytes stops the run.
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: Tag the version and make the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -- "v$VERSION" --target "$GITHUB_SHA" --generate-notes
          # A pre-release has a letter in its version: 3.0.0a0, 3.0.0rc1, 3.0.0.dev1. The letters of a post-release
          # do not make it one: 3.0.0.post1.
          case "${VERSION//post/}" in *[a-z]*) set -- "$@" --prerelease ;; esac
          gh release create "$@"
