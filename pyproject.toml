[project]
name = "rask-sdk"
version = "3.0.0a0"
description = "Official Python SDK for the Rask API v3 (video and audio localization)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brask Inc." }]
keywords = ["rask", "dubbing", "localization", "video", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
# The API v2 client in rask_sdk.v2 (OAuth client credentials through Authlib).
v2 = ["Authlib>=1.3.2"]

[project.urls]
Documentation = "https://docs.api.rask.ai"
Repository = "https://github.com/braskai/rask-sdk-python"
Issues = "https://github.com/braskai/rask-sdk-python/issues"

[dependency-groups]
dev = [
    "Authlib>=1.3.2",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rask_sdk"]

[tool.hatch.build.targets.sdist]
include = ["rask_sdk", "contract", "tools", "tests", "examples", "README.md", "LICENSE", "Makefile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["rask_sdk/_generated", "rask_sdk/v2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "S101",   # assert is what tests are for
    "S311",   # jitter does not need a CSPRNG
    "SIM108", # a plain if/else reads better in the retry logic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "S607", "S108"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["rask_sdk", "examples", "tools"]
exclude = ["^rask_sdk/v2/"]

[[tool.mypy.overrides]]
module = "rask_sdk.v2.*"
ignore_errors = true
follow_imports = "skip"
